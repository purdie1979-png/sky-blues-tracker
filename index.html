<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbrain FC Sky Blues</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background-color: #1a080c; color: white; text-align: center; }
    h1 { color: #5bc0be; margin-bottom: 5px; }
    .sub-head { color: #888; font-size: 14px; margin-bottom: 15px; }
    .nav { display: flex; justify-content: space-around; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; flex-wrap: wrap; }
    .nav button { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; padding: 8px 5px; }
    .nav button.active { color: #5bc0be; font-weight: bold; border-bottom: 2px solid #5bc0be; }
    .form-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .row { display: flex; gap: 10px; }
    input, select { padding: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #333; background: #2a1219; color: white; width: 100%; box-sizing: border-box; }
    .btn { padding: 10px 15px; background-color: #5bc0be; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #2a1219; margin: 8px 0; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .del-btn { background: #ff4d4d; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .date-badge { color: #5bc0be; font-size: 12px; display: block; font-weight: bold; }
  </style>
</head>
<body>

  <h1>CARBRAIN FC SKY BLUES</h1>
  <div class="sub-head">Match & Fixture Tracker</div>

  <div class="nav">
    <button class="active" onclick="showTab('fixtures')">Fixtures</button>
    <button onclick="showTab('results')">Results</button>
  </div>

  <!-- FIXTURES TAB -->
  <div id="fixtures" class="tab-content active">
    <h3>Upcoming Fixtures</h3>
    <div class="form-box">
      <input type="text" id="fix-opponent" placeholder="Opponent Name">
      <input type="date" id="fix-date">
      <button class="btn" onclick="addFixture()">Add Fixture</button>
    </div>
    <ul id="fixtures-list"></ul>
  </div>

  <!-- RESULTS TAB -->
  <div id="results" class="tab-content">
    <h3>Match Results</h3>
    <div class="form-box">
      <input type="text" id="res-opponent" placeholder="Opponent Name">
      <div class="row">
        <input type="number" id="res-gf" placeholder="Goals For">
        <input type="number" id="res-ga" placeholder="Goals Against">
      </div>
      <input type="date" id="res-date">
      <button class="btn" onclick="addResult()">Add Result</button>
    </div>
    <ul id="results-list"></ul>
  </div>

  <script>
    let fixtures = JSON.parse(localStorage.getItem('sky_fixtures')) || [];
    let results = JSON.parse(localStorage.getItem('sky_results')) || [];

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'Date TBD';
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderFixtures() {
      const list = document.getElementById('fixtures-list');
      list.innerHTML = '';
      fixtures.forEach((item, index) => {
        list.innerHTML += `
          <li>
            <div>
              <span class="date-badge">${formatDate(item.date)}</span>
              <strong>vs ${item.opponent}</strong>
            </div>
            <button class="del-btn" onclick="deleteFixture(${index})">X</button>
          </li>
        `;
      });
    }

    function renderResults() {
      const list = document.getElementById('results-list');
      list.innerHTML = '';
      results.forEach((item, index) => {
        list.innerHTML += `
          <li>
            <div>
              <span class="date-badge">${formatDate(item.date)}</span>
              <strong>vs ${item.opponent}</strong> (${item.gf} - ${item.ga})
            </div>
            <button class="del-btn" onclick="deleteResult(${index})">X</button>
          </li>
        `;
      });
    }

    function addFixture() {
      const opponent = document.getElementById('fix-opponent').value;
      const date = document.getElementById('fix-date').value;
      if (!opponent) return;
      fixtures.push({ opponent, date });
      localStorage.setItem('sky_fixtures', JSON.stringify(fixtures));
      document.getElementById('fix-opponent').value = '';
      document.getElementById('fix-date').value = '';
      renderFixtures();
    }

    function addResult() {
      const opponent = document.getElementById('res-opponent').value;
      const gf = document.getElementById('res-gf').value || 0;
      const ga = document.getElementById('res-ga').value || 0;
      const date = document.getElementById('res-date').value;
      if (!opponent) return;
      results.push({ opponent, gf, ga, date });
      localStorage.setItem('sky_results', JSON.stringify(results));
      document.getElementById('res-opponent').value = '';
      document.getElementById('res-gf').value = '';
      document.getElementById('res-ga').value = '';
      document.getElementById('res-date').value = '';
      renderResults();
    }

    function deleteFixture(index) {
      fixtures.splice(index, 1);
      localStorage.setItem('sky_fixtures', JSON.stringify(fixtures));
      renderFixtures();
    }

    function deleteResult(index) {
      results.splice(index, 1);
      localStorage.setItem('sky_results', JSON.stringify(results));
      renderResults();
    }

    // Initial load
    renderFixtures();
    renderResults();
  </script>
</body>
</html>
