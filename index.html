<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbrain FC Sky Blues</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 15px; background-color: #1a080c; color: white; text-align: center; }
    h1 { color: #5bc0be; margin-bottom: 2px; font-size: 24px; text-transform: uppercase; }
    .status-bar { font-size: 11px; color: #888; margin-bottom: 15px; }
    .status-bar span { color: #5bc0be; }
    
    .admin-panel { background: #2a1219; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .pin-btn { background: #5bc0be; color: #1a080c; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    
    .card { background: #2a1219; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: left; }
    .card h2 { margin-top: 0; font-size: 18px; text-align: center; color: #fff; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .row { display: flex; gap: 8px; }
    input, select { padding: 10px; border-radius: 5px; border: 1px solid #333; background: #1a080c; color: white; font-size: 14px; width: 100%; box-sizing: border-box; }
    .action-btn { width: 100%; background: #5bc0be; color: #1a080c; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
    .small-btn { background: #5bc0be; color: #1a080c; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
    .del-btn { background: #c62828; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }

    .list-item { background: #1a080c; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .date-tag { font-size: 11px; color: #5bc0be; font-weight: bold; display: block; margin-bottom: 2px; }
    .badge { background: #5bc0be; color: #1a080c; font-weight: bold; padding: 4px 8px; border-radius: 12px; font-size: 13px; }
    
    .bulk-att-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
    .bulk-att-row select { width: 45%; }

    .nav { display: flex; justify-around: border-top: 1px solid #333; padding-top: 10px; position: fixed; bottom: 0; left: 0; right: 0; background: #1a080c; max-width: 500px; margin: 0 auto; }
    .nav button { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; padding: 8px 5px; }
    .nav button.active { color: #5bc0be; font-weight: bold; border-bottom: 2px solid #5bc0be; }
    .tab-content { display: none; padding-bottom: 70px; }
    .tab-content.active { display: block; }
    .empty-msg { text-align: center; color: #888; font-size: 13px; margin: 10px 0; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h1>Carbrain FC Sky Blues</h1>
  <div class="status-bar"><span id="db-status">Connecting...</span> · Everyone sees this data</div>

  <div class="admin-panel">
    <span id="mode-text">Mode: Spectator (Read Only)</span>
    <button class="pin-btn" onclick="toggleAdmin()">Admin PIN</button>
  </div>

  <!-- SQUAD TAB -->
  <div id="squad-tab" class="tab-content active">
    <div class="card">
      <h2>Squad Players</h2>
      <div id="squad-form" class="form-group" style="display:none;">
        <div class="row">
          <input type="number" id="p-num" placeholder="#" style="width: 30%;">
          <input type="text" id="p-name" placeholder="Player Name" style="width: 70%;">
        </div>
        <button class="action-btn" onclick="addPlayer()">Add Player</button>
      </div>
      <div id="squad-list"></div>
    </div>
  </div>

  <!-- ATTENDANCE TAB -->
  <div id="attendance-tab" class="tab-content">
    <div class="card">
      <h2>Record Attendance Session</h2>
      <div id="attendance-form" class="form-group" style="display:none;">
        <div class="row">
          <input type="date" id="att-date" style="width: 50%;">
          <select id="att-type" style="width: 50%;">
            <option value="Training">Training</option>
            <option value="Match Day">Match Day</option>
          </select>
        </div>
        
        <div style="margin-top:10px; font-size:13px; color:#5bc0be; font-weight:bold; text-align:left;">
          Mark Status for Each Player:
        </div>
        
        <div id="bulk-players-container" style="margin-bottom:10px;"></div>
        
        <button class="action-btn" onclick="submitBulkAttendance()">Save Attendance Session</button>
      </div>
      <div id="att-read-only-msg" class="empty-msg">Log in with Admin PIN to record session attendance.</div>
    </div>

    <div class="card">
      <h2>Attendance History</h2>
      <div id="attendance-history"></div>
    </div>
  </div>

  <!-- RESULTS TAB -->
  <div id="results-tab" class="tab-content">
    <div class="card">
      <h2>Match Results</h2>
      <div id="match-form" class="form-group" style="display:none;">
        <div class="row">
          <input type="text" id="m-opponent" placeholder="Opponent Name" style="width: 65%;">
          <select id="m-venue" style="width: 35%;">
            <option value="Home">Home</option>
            <option value="Away">Away</option>
          </select>
        </div>
        <div class="row">
          <input type="number" id="m-us" placeholder="Us">
          <input type="number" id="m-them" placeholder="Them">
        </div>
        <input type="date" id="m-date">
        
        <div style="margin-top: 10px;">
          <label style="font-size:12px; color:#5bc0be;">Add Goal Scorers:</label>
          <div class="row" style="margin-top:5px;">
            <select id="m-scorer" style="width: 65%;">
              <option value="">Select Scorer</option>
            </select>
            <input type="number" id="m-goals" placeholder="Goals" min="1" value="1" style="width: 35%;">
          </div>
          <button type="button" class="small-btn" onclick="addScorerToMatch()" style="margin-top:5px; width:100%;">+ Add Scorer to Game</button>
          <div id="match-scorers-temp" style="font-size:12px; margin-top:5px; color:#aaa;"></div>
        </div>

        <button class="action-btn" onclick="logMatch()">Save Match Result</button>
      </div>
      <div id="matches-list"></div>
    </div>
  </div>

  <!-- FIXTURES TAB -->
  <div id="fixtures-tab" class="tab-content">
    <div class="card">
      <h2>Upcoming Fixtures</h2>
      <div id="fixture-form" class="form-group" style="display:none;">
        <input type="text" id="f-opponent" placeholder="Opponent Team">
        <input type="date" id="f-date">
        <button class="action-btn" onclick="addFixture()">Add Fixture</button>
      </div>
      <div id="fixtures-list"></div>
    </div>
  </div>

  <!-- SCORERS TAB -->
  <div id="scorers-tab" class="tab-content">
    <div class="card">
      <h2>Top Goal Scorers</h2>
      <div id="scorers-list"></div>
    </div>
  </div>

  <!-- NAV BAR -->
  <div class="nav">
    <button class="active" onclick="switchTab('squad-tab', this)">Squad</button>
    <button onclick="switchTab('attendance-tab', this)">Attendance</button>
    <button onclick="switchTab('results-tab', this)">Results</button>
    <button onclick="switchTab('fixtures-tab', this)">Fixtures</button>
    <button onclick="switchTab('scorers-tab', this)">Scorers</button>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://sky-blues-tracker-default-rtdb.firebaseio.com" 
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // Check Firebase connection
    db.ref('.info/connected').on('value', snap => {
      document.getElementById('db-status').innerText = snap.val() === true ? "Synced" : "Disconnected";
    });

    let isAdmin = false;
    let currentMatchScorers = [];
    let playerListGlobal = [];

    function toggleAdmin() {
      if (!isAdmin) {
        const pin = prompt("Enter Admin PIN:");
        if (pin === "1234") {
          isAdmin = true;
          document.getElementById('mode-text').innerText = "Mode: Coach (Admin)";
          updateAdminUI();
        } else {
          alert("Incorrect PIN");
        }
      }
    }

    function updateAdminUI() {
      const displayStyle = isAdmin ? "flex" : "none";
      document.getElementById('squad-form').style.display = displayStyle;
      document.getElementById('attendance-form').style.display = displayStyle;
      document.getElementById('match-form').style.display = displayStyle;
      document.getElementById('fixture-form').style.display = displayStyle;
      
      const readMsg = document.getElementById('att-read-only-msg');
      if (readMsg) readMsg.style.display = isAdmin ? "none" : "block";

      renderPlayers();
      renderFixtures();
      renderAttendanceHistory();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function formatDate(dStr) {
      if (!dStr) return 'No Date';
      const d = new Date(dStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // SQUAD & ATTENDANCE RENDER
    function renderPlayers() {
      const squadList = document.getElementById('squad-list');
      const bulkContainer = document.getElementById('bulk-players-container');
      const scorerSelect = document.getElementById('m-scorer');

      squadList.innerHTML = '';
      bulkContainer.innerHTML = '';
      scorerSelect.innerHTML = '<option value="">Select Scorer</option>';

      if (playerListGlobal.length === 0) {
        squadList.innerHTML = '<div class="empty-msg">No players in squad yet. Enter PIN and add players.</div>';
        bulkContainer.innerHTML = '<div class="empty-msg">No players available for attendance. Add squad players first.</div>';
        return;
      }

      playerListGlobal.forEach(p => {
        const numLabel = p.number ? `#${p.number}` : '#-';
        const delBtn = isAdmin ? `<button class="del-btn" onclick="deletePlayer('${p.id}')">Delete</button>` : '';

        squadList.innerHTML += `
          <div class="list-item">
            <div>
              <span class="badge" style="margin-right:8px;">${numLabel}</span>
              <strong>${p.name}</strong>
            </div>
            ${delBtn}
          </div>`;

        bulkContainer.innerHTML += `
          <div class="bulk-att-row">
            <span><strong>${numLabel}</strong> ${p.name}</span>
            <select class="bulk-status" data-player="${p.name}">
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
              <option value="Excused">Excused</option>
            </select>
          </div>`;

        scorerSelect.innerHTML += `<option value="${p.name}">${numLabel} ${p.name}</option>`;
      });
    }

    db.ref('players').on('value', snapshot => {
      playerListGlobal = [];
      snapshot.forEach(child => {
        const p = child.val();
        playerListGlobal.push({
          id: child.key,
          name: p.name || 'Unnamed Player',
          number: p.number || ''
        });
      });
      renderPlayers();
    }, error => {
      alert("Firebase Read Error: " + error.message);
    });

    function addPlayer() {
      const name = document.getElementById('p-name').value.trim();
      const number = document.getElementById('p-num').value.trim();
      if (!name) { alert('Please enter a player name'); return; }
      
      const newRef = db.ref('players').push();
      newRef.set({ name: name, number: number }, (error) => {
        if (error) {
          alert('Failed to save player: ' + error.message);
        } else {
          document.getElementById('p-name').value = '';
          document.getElementById('p-num').value = '';
        }
      });
    }

    function deletePlayer(id) {
      if (confirm('Delete this player?')) {
        db.ref('players/' + id).remove(err => {
          if (err) alert("Delete Error: " + err.message);
        });
      }
    }

    // ATTENDANCE LOGGING & HISTORY
    function submitBulkAttendance() {
      const date = document.getElementById('att-date').value;
      const type = document.getElementById('att-type').value;
      if (!date) { alert('Please select a date'); return; }

      const selects = document.querySelectorAll('.bulk-status');
      if (selects.length === 0) {
        alert('No players in squad to mark attendance for!');
        return;
      }

      const records = [];
      selects.forEach(sel => {
        records.push({
          player: sel.getAttribute('data-player'),
          status: sel.value
        });
      });

      db.ref('attendance_sessions').push({ date, type, records }, (err) => {
        if (err) {
          alert('Failed to save attendance: ' + err.message);
        } else {
          alert('Attendance session saved successfully!');
        }
      });
    }

    let attendanceSnapshotGlobal = null;

    function deleteAttendanceSession(id) {
      if (confirm('Are you sure you want to delete this attendance session?')) {
        db.ref('attendance_sessions/' + id).remove(err => {
          if (err) alert("Delete Error: " + err.message);
        });
      }
    }

    function renderAttendanceHistory() {
      const history = document.getElementById('attendance-history');
      history.innerHTML = '';

      if (!attendanceSnapshotGlobal || !attendanceSnapshotGlobal.exists()) {
        history.innerHTML = '<div class="empty-msg">No attendance sessions logged yet.</div>';
        return;
      }

      attendanceSnapshotGlobal.forEach(child => {
        const session = child.val();
        const sessionId = child.key;
        let recordsHTML = '';
        if (session.records) {
          session.records.forEach(r => {
            let color = '#2e7d32'; // Present
            if (r.status === 'Absent') color = '#c62828';
            if (r.status === 'Excused') color = '#f57c00';

            recordsHTML += `
              <div style="font-size:12px; margin: 3px 0; display:flex; justify-content:space-between; width:100%;">
                <span>${r.player}</span>
                <span style="color:${color}; font-weight:bold;">${r.status}</span>
              </div>`;
          });
        }

        const delBtn = isAdmin ? `<button class="del-btn" onclick="deleteAttendanceSession('${sessionId}')">Delete</button>` : '';

        history.innerHTML += `
          <div class="list-item" style="flex-direction:column; align-items:flex-start; gap:4px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center; border-bottom:1px solid #333; padding-bottom:4px; margin-bottom:4px;">
              <span class="date-tag">${formatDate(session.date)} (${session.type})</span>
              ${delBtn}
            </div>
            <div style="width:100%;">${recordsHTML}</div>
          </div>`;
      });
    }

    db.ref('attendance_sessions').on('value', snapshot => {
      attendanceSnapshotGlobal = snapshot;
      renderAttendanceHistory();
    });

    // RESULTS & TOP SCORERS
    function addScorerToMatch() {
      const player = document.getElementById('m-scorer').value;
      const goals = parseInt(document.getElementById('m-goals').value) || 1;
      if (!player) return;

      currentMatchScorers.push({ player, goals });
      document.getElementById('match-scorers-temp').innerText = currentMatchScorers.map(s => `${s.player} (${s.goals})`).join(', ');
      document.getElementById('m-scorer').value = '';
      document.getElementById('m-goals').value = '1';
    }

    function logMatch() {
      const opponent = document.getElementById('m-opponent').value.trim();
      const venue = document.getElementById('m-venue').value;
      const us = document.getElementById('m-us').value || 0;
      const them = document.getElementById('m-them').value || 0;
      const date = document.getElementById('m-date').value;
      if (!opponent) { alert('Please enter opponent name'); return; }

      db.ref('matches').push({ opponent, venue, us, them, date, scorers: currentMatchScorers }, (err) => {
        if (err) {
          alert('Failed to save match result: ' + err.message);
        } else {
          document.getElementById('m-opponent').value = '';
          document.getElementById('m-us').value = '';
          document.getElementById('m-them').value = '';
          document.getElementById('m-date').value = '';
          document.getElementById('match-scorers-temp').innerText = '';
          currentMatchScorers = [];
        }
      });
    }

    db.ref('matches').on('value', snapshot => {
      const matchesContainer = document.getElementById('matches-list');
      const scorersContainer = document.getElementById('scorers-list');
      matchesContainer.innerHTML = '';
      scorersContainer.innerHTML = '';

      const scorerTotals = {};

      if (!snapshot.exists()) {
        matchesContainer.innerHTML = '<div class="empty-msg">No results logged yet.</div>';
        scorersContainer.innerHTML = '<div class="empty-msg">No goals logged yet.</div>';
        return;
      }

      snapshot.forEach(child => {
        const data = child.val();
        let scorersText = '';
        if (data.scorers && data.scorers.length > 0) {
          scorersText = '⚽ ' + data.scorers.map(s => `${s.player} (${s.goals})`).join(', ');
          data.scorers.forEach(s => {
            scorerTotals[s.player] = (scorerTotals[s.player] || 0) + s.goals;
          });
        }

        matchesContainer.innerHTML += `
          <div class="list-item" style="flex-direction:column; align-items:flex-start; gap:4px;">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
              <div>
                <span class="date-tag">${formatDate(data.date)} (${data.venue})</span>
                <strong>vs ${data.opponent}</strong>
              </div>
              <span class="badge">${data.us} - ${data.them}</span>
            </div>
            <div style="font-size:12px; color:#aaa;">${scorersText}</div>
          </div>`;
      });

      const sortedScorers = Object.entries(scorerTotals).sort((a, b) => b[1] - a[1]);
      if (sortedScorers.length === 0) {
        scorersContainer.innerHTML = '<div class="empty-msg">No goals logged yet.</div>';
      } else {
        sortedScorers.forEach(([player, goals]) => {
          scorersContainer.innerHTML += `
            <div class="list-item">
              <strong>${player}</strong>
              <span class="badge">${goals} ${goals === 1 ? 'goal' : 'goals'}</span>
            </div>`;
        });
      }
    });

    // FIXTURES
    let rawFixtures = [];
    function renderFixtures() {
      const container = document.getElementById('fixtures-list');
      container.innerHTML = '';

      if (rawFixtures.length === 0) {
        container.innerHTML = '<div class="empty-msg">No upcoming fixtures scheduled.</div>';
        return;
      }

      rawFixtures.forEach(f => {
        const playedBtn = (isAdmin && !f.played) ? `<button class="small-btn" onclick="markFixturePlayed('${f.id}')">Mark Played</button>` : '';
        const statusBadge = f.played ? `<span class="badge" style="background:#555; color:#fff;">Played</span>` : playedBtn;

        container.innerHTML += `
          <div class="list-item">
            <div>
              <span class="date-tag">${formatDate(f.date)}</span>
              <strong>vs ${f.opponent}</strong>
            </div>
            ${statusBadge}
          </div>`;
      });
    }

    db.ref('fixtures').on('value', snapshot => {
      rawFixtures = [];
      snapshot.forEach(child => {
        const f = child.val();
        f.id = child.key;
        rawFixtures.push(f);
      });
      renderFixtures();
    });

    function addFixture() {
      const opponent = document.getElementById('f-opponent').value.trim();
      const date = document.getElementById('f-date').value;
      if (!opponent) return;

      db.ref('fixtures').push({ opponent, date, played: false }, (err) => {
        if (err) {
          alert('Failed to save fixture: ' + err.message);
        } else {
          document.getElementById('f-opponent').value = '';
          document.getElementById('f-date').value = '';
        }
      });
    }

    function markFixturePlayed(id) {
      db.ref('fixtures/' + id).update({ played: true }, err => {
        if (err) alert("Update Error: " + err.message);
      });
    }

    // Set today's date default on date fields
    const todayStr = new Date().toISOString().split('T')[0];
    if (document.getElementById('att-date')) document.getElementById('att-date').value = todayStr;
    if (document.getElementById('m-date')) document.getElementById('m-date').value = todayStr;
    if (document.getElementById('f-date')) document.getElementById('f-date').value = todayStr;
  </script>
</body>
</html>
