<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Carbrain FC Sky Blues</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2B0E13" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B0E13; --card:#3D1620; --border:#552733; --border2:#6B3541;
    --accent:#4FC3E8; --muted:#C79098; --muted2:#8A5D66; --text:#FBF3F0;
    --amber:#E8871E; --red:#D64550; --gold:#F0B93B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  h1,h2{font-family:'Oswald',sans-serif;margin:0;}
  header{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--border);}
  .badge{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;flex-shrink:0;}
  .h-title{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.5px;font-weight:700;}
  .h-sub{color:var(--muted2);font-size:11.5px;margin-top:1px;}
  main{flex:1;padding:18px 16px 24px;overflow-y:auto;max-width:480px;margin:0 auto;width:100%;}
  nav{display:flex;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg);padding:6px 0 max(6px,env(safe-area-inset-bottom));}
  nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:var(--muted2);font-size:11px;font-weight:500;font-family:inherit;}
  nav button.active{color:var(--accent);font-weight:700;}
  .eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:2px;}
  .title{font-size:26px;letter-spacing:.3px;}
  .section-head{margin-bottom:16px;}
  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  input,select{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
  .add-btn{background:var(--accent);border:none;border-radius:10px;width:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:20px;color:var(--bg);font-weight:700;}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .row.clickable{cursor:pointer;padding:12px 14px;}
  .shirt{width:28px;height:28px;border-radius:8px;background:var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .name{flex:1;font-weight:600;}
  .ghost-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--muted2);font-size:16px;}
  .empty{color:var(--muted2);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--border2);border-radius:12px;}
  .chip{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--muted2);font-weight:700;font-size:12px;}
  .chip.active-present{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  .chip.active-excused{background:var(--amber);border-color:var(--amber);color:var(--bg);}
  .chip.active-absent{background:var(--red);border-color:var(--red);color:var(--bg);}
  .tag{font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 8px;border-radius:6px;flex-shrink:0;}
  .tag.match{background:rgba(232,135,30,.18);color:var(--amber);}
  .tag.training{background:rgba(79,195,232,.18);color:var(--accent);}
  .chev{color:var(--border2);font-size:16px;}
  .back-link,.danger-link{background:none;border:none;font-size:13px;cursor:pointer;padding:0;font-family:inherit;}
  .back-link{color:var(--accent);font-weight:600;margin-bottom:14px;display:block;}
  .danger-link{color:var(--red);margin-top:14px;display:block;}
  .primary-btn{width:100%;background:var(--accent);border:none;border-radius:10px;padding:12px 0;color:var(--bg);font-weight:700;font-size:14px;cursor:pointer;margin-top:18px;font-family:inherit;}
  .score-row{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 10px;}
  .stepper{text-align:center;flex:1;}
  .stepper .lbl{color:var(--muted2);font-size:11px;margin-bottom:6px;font-weight:600;}
  .stepper .val{font-family:'Oswald',sans-serif;font-size:28px;min-width:30px;display:inline-block;}
  .step-btn{width:26px;height:26px;border-radius:7px;background:var(--border2);border:none;cursor:pointer;color:var(--text);font-weight:700;}
  .result-badge{width:26px;height:26px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;flex-shrink:0;}
  .rank{width:22px;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;text-align:center;flex-shrink:0;}
  .goal-count{width:22px;text-align:center;font-weight:700;}
  .sync-banner{background:rgba(232,135,30,.15);color:var(--amber);font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="badge">CFC</div>
  <div>
    <div class="h-title">CARBRAIN FC SKY BLUES</div>
    <div class="h-sub" id="syncStatus">Loading…</div>
  </div>
</header>

<main id="main"></main>

<nav id="nav">
  <button data-tab="squad" class="active">Squad</button>
  <button data-tab="attendance">Attendance</button>
  <button data-tab="matches">Matches</button>
  <button data-tab="scorers">Scorers</button>
</nav>

<!-- ===================== FIREBASE CONFIG ===================== -->
<!-- Paste your Firebase project's config object below, replacing  -->
<!-- the placeholder values. See README.md for step-by-step help.  -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoU3Si6fncIj6UAnr67mBSGe5ql2z4JDc",
  authDomain: "sky-blues-tracker.firebaseapp.com",
  projectId: "sky-blues-tracker",
  storageBucket: "sky-blues-tracker.firebasestorage.app",
  messagingSenderId: "640334431259",
  appId: "1:640334431259:web:9b9af00a7d5ad741fd64be"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);/* ============================================================ */

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const teamDocRef = doc(db, "teams", "sky-blues");

let data = { players: [], sessions: [], matches: [] };
let tab = "squad";
let view = { attendance: null, matchForm: null };

const $main = document.getElementById("main");
const $sync = document.getElementById("syncStatus");
const $nav = document.getElementById("nav");

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

async function save(next){
  data = next;
  render();
  try{
    await setDoc(teamDocRef, next);
    $sync.textContent = "Synced · everyone sees this data";
  }catch(e){
    $sync.textContent = "Couldn't sync — check your connection";
  }
}

onSnapshot(teamDocRef, (snap) => {
  if (snap.exists()) {
    data = snap.data();
  } else {
    data = { players: [], sessions: [], matches: [] };
    setDoc(teamDocRef, data);
  }
  $sync.textContent = "Synced · everyone sees this data";
  render();
}, (err) => {
  $sync.textContent = "Offline / no connection to Firebase";
});

$nav.addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  tab = btn.dataset.tab;
  view = { attendance:null, matchForm:null };
  render();
});

function render(){
  [...$nav.children].forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "squad") renderSquad();
  else if (tab === "attendance") renderAttendance();
  else if (tab === "matches") renderMatches();
  else if (tab === "scorers") renderScorers();
}

/* ---------------- SQUAD ---------------- */
function renderSquad(){
  const sorted = [...data.players].sort((a,b)=>{
    const an=parseInt(a.number,10), bn=parseInt(b.number,10);
    if(!isNaN(an)&&!isNaN(bn)) return an-bn;
    return a.name.localeCompare(b.name);
  });
  $main.innerHTML = `
    <div class="section-head"><div class="eyebrow">${data.players.length} PLAYERS</div><h1 class="title">Squad</h1></div>
    <div class="add-row">
      <input id="pName" style="flex:1" placeholder="Player name" />
      <input id="pNum" style="width:56px;text-align:center" placeholder="#" />
      <button class="add-btn" id="pAdd">+</button>
    </div>
    ${sorted.length===0 ? `<div class="empty">Add your ten players to get started.</div>` : ""}
    ${sorted.map(p=>`
      <div class="row">
        <div class="shirt">${esc(p.number)||"–"}</div>
        <div class="name">${esc(p.name)}</div>
        <button class="ghost-btn" data-remove="${p.id}">✕</button>
      </div>`).join("")}
  `;
  document.getElementById("pAdd").onclick = ()=>{
    const name = document.getElementById("pName").value.trim();
    const number = document.getElementById("pNum").value.trim();
    if(!name) return;
    save({...data, players:[...data.players, {id:uid(), name, number}]});
  };
  $main.querySelectorAll("[data-remove]").forEach(b=>{
    b.onclick = ()=> save({...data, players: data.players.filter(p=>p.id!==b.dataset.remove)});
  });
}

/* ---------------- ATTENDANCE ---------------- */
function renderAttendance(){
  const sorted = [...data.sessions].sort((a,b)=> a.date<b.date?1:-1);
  const editing = sorted.find(s=>s.id===view.attendance);

  if(editing){
    const present = Object.values(editing.presence).filter(v=>v==="present").length;
    $main.innerHTML = `
      <button class="back-link" id="back">← All sessions</button>
      <div class="section-head"><div class="eyebrow">${editing.type==="training"?"TRAINING":"MATCH DAY"}</div><h1 class="title">${fmtDate(editing.date)}</h1></div>
      <div style="color:var(--muted2);font-size:13px;margin-bottom:14px;">${present} of ${data.players.length} present</div>
      ${data.players.length===0?`<div class="empty">Add players in the Squad tab first.</div>`:""}
      ${data.players.map(p=>{
        const status = editing.presence[p.id] || "present";
        return `<div class="row">
          <div class="name">${esc(p.name)}</div>
          <div style="display:flex;gap:4px;">
            <button class="chip ${status==='present'?'active-present':''}" data-set="${p.id}|present">✓</button>
            <button class="chip ${status==='excused'?'active-excused':''}" data-set="${p.id}|excused">?</button>
            <button class="chip ${status==='absent'?'active-absent':''}" data-set="${p.id}|absent">−</button>
          </div>
        </div>`;
      }).join("")}
      <button class="danger-link" id="delSession">Delete this session</button>
    `;
    document.getElementById("back").onclick = ()=>{ view.attendance=null; render(); };
    document.getElementById("delSession").onclick = ()=>{
      save({...data, sessions: data.sessions.filter(s=>s.id!==editing.id)});
      view.attendance=null; render();
    };
    $main.querySelectorAll("[data-set]").forEach(b=>{
      b.onclick = ()=>{
        const [pid, status] = b.dataset.set.split("|");
        const sessions = data.sessions.map(s=> s.id===editing.id ? {...s, presence:{...s.presence,[pid]:status}} : s);
        save({...data, sessions});
      };
    });
    return;
  }

  $main.innerHTML = `
    <div class="section-head"><div class="eyebrow">LOG A SESSION</div><h1 class="title">Attendance</h1></div>
    <div class="add-row">
      <input type="date" id="sDate" style="flex:1" value="${todayISO()}" />
      <select id="sType" style="width:110px">
        <option value="training">Training</option>
        <option value="match">Match</option>
      </select>
      <button class="add-btn" id="sAdd">+</button>
    </div>
    ${sorted.length===0?`<div class="empty">No sessions logged yet.</div>`:""}
    ${sorted.map(s=>{
      const present = Object.values(s.presence).filter(v=>v==="present").length;
      return `<button class="row clickable" style="width:100%;border:1px solid var(--border);text-align:left;font-family:inherit;color:inherit;" data-open="${s.id}">
        <div class="tag ${s.type}">${s.type==="match"?"MATCH":"TRAINING"}</div>
        <div style="flex:1;text-align:left;">
          <div style="font-weight:600;">${fmtDate(s.date)}</div>
          <div style="color:var(--muted2);font-size:12px;">${present}/${data.players.length} present</div>
        </div>
        <div class="chev">›</div>
      </button>`;
    }).join("")}
  `;
  document.getElementById("sAdd").onclick = ()=>{
    const dateVal = document.getElementById("sDate").value || todayISO();
    const typeVal = document.getElementById("sType").value;
    const presence = {};
    data.players.forEach(p=> presence[p.id]="present");
    const session = {id:uid(), date:dateVal, type:typeVal, presence};
    save({...data, sessions:[session, ...data.sessions]});
    view.attendance = session.id; render();
  };
  $main.querySelectorAll("[data-open]").forEach(b=>{
    b.onclick = ()=>{ view.attendance = b.dataset.open; render(); };
  });
}

/* ---------------- MATCHES ---------------- */
function renderMatches(){
  const sorted = [...data.matches].sort((a,b)=> a.date<b.date?1:-1);
  const form = view.matchForm;

  if(form){
    const totalGoals = form.scorers.reduce((s,x)=>s+x.goals,0);
    const exists = data.matches.some(m=>m.id===form.id);
    $main.innerHTML = `
      <button class="back-link" id="back">← All matches</button>
      <div class="section-head"><div class="eyebrow">MATCH DETAILS</div><h1 class="title">${esc(form.opponent)||"New match"}</h1></div>
      <div class="add-row">
        <input type="date" id="mDate" style="flex:1" value="${form.date}" />
        <select id="mHA" style="width:100px">
          <option ${form.homeAway==="Home"?"selected":""}>Home</option>
          <option ${form.homeAway==="Away"?"selected":""}>Away</option>
        </select>
      </div>
      <input id="mOpp" style="width:100%;margin-bottom:10px;" placeholder="Opponent" value="${esc(form.opponent)}" />
      <div class="score-row">
        <div class="stepper">
          <div class="lbl">Sky Blues</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
            <button class="step-btn" data-score="us|-1">−</button>
            <span class="val" style="color:var(--accent);" id="usScore">${form.ourScore}</span>
            <button class="step-btn" data-score="us|1">+</button>
          </div>
        </div>
        <div style="color:var(--border2);font-size:22px;">–</div>
        <div class="stepper">
          <div class="lbl">${esc(form.opponent)||"Opponent"}</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
            <button class="step-btn" data-score="them|-1">−</button>
            <span class="val" id="themScore">${form.theirScore}</span>
            <button class="step-btn" data-score="them|1">+</button>
          </div>
        </div>
      </div>
      <div style="margin:18px 0 8px;color:var(--muted2);font-size:12px;font-weight:700;letter-spacing:.5px;">GOALSCORERS ${totalGoals>0?`· ${totalGoals} logged`:""}</div>
      ${data.players.length===0?`<div class="empty">Add players in the Squad tab first.</div>`:""}
      ${data.players.map(p=>{
        const s = form.scorers.find(x=>x.playerId===p.id);
        const goals = s? s.goals : 0;
        return `<div class="row">
          <div class="name">${esc(p.name)}</div>
          <button class="step-btn" data-goal="${p.id}|-1" ${goals===0?"disabled":""}>−</button>
          <div class="goal-count">${goals}</div>
          <button class="step-btn" data-goal="${p.id}|1">+</button>
        </div>`;
      }).join("")}
      <button class="primary-btn" id="saveMatch">Save match</button>
      ${exists?`<button class="danger-link" id="delMatch">Delete this match</button>`:""}
    `;
    document.getElementById("back").onclick = ()=>{ view.matchForm=null; render(); };
    document.getElementById("mDate").oninput = (e)=>{ form.date = e.target.value; };
    document.getElementById("mHA").onchange = (e)=>{ form.homeAway = e.target.value; };
    document.getElementById("mOpp").oninput = (e)=>{ form.opponent = e.target.value; render(); };
    $main.querySelectorAll("[data-score]").forEach(b=>{
      b.onclick = ()=>{
        const [who, delta] = b.dataset.score.split("|");
        if(who==="us") form.ourScore = Math.max(0, form.ourScore + Number(delta));
        else form.theirScore = Math.max(0, form.theirScore + Number(delta));
        render();
      };
    });
    $main.querySelectorAll("[data-goal]").forEach(b=>{
      b.onclick = ()=>{
        const [pid, delta] = b.dataset.goal.split("|");
        const d = Number(delta);
        const existing = form.scorers.find(s=>s.playerId===pid);
        if(d>0){
          if(existing) existing.goals += 1;
          else form.scorers.push({playerId:pid, goals:1});
        } else {
          if(existing){
            existing.goals -= 1;
            if(existing.goals<=0) form.scorers = form.scorers.filter(s=>s.playerId!==pid);
          }
        }
        render();
      };
    });
    document.getElementById("saveMatch").onclick = ()=>{
      if(!form.opponent.trim()) return;
      const matches = exists ? data.matches.map(m=> m.id===form.id?form:m) : [form, ...data.matches];
      save({...data, matches});
      view.matchForm=null; render();
    };
    const delBtn = document.getElementById("delMatch");
    if(delBtn) delBtn.onclick = ()=>{
      save({...data, matches: data.matches.filter(m=>m.id!==form.id)});
      view.matchForm=null; render();
    };
    return;
  }

  $main.innerHTML = `
    <div class="section-head"><div class="eyebrow">${data.matches.length} PLAYED</div><h1 class="title">Matches</h1></div>
    <button class="primary-btn" style="margin-top:0;margin-bottom:16px;" id="newMatch">+ Log a match</button>
    ${sorted.length===0?`<div class="empty">No matches logged yet.</div>`:""}
    ${sorted.map(m=>{
      const result = m.ourScore>m.theirScore?"W":m.ourScore<m.theirScore?"L":"D";
      const color = result==="W"?"var(--accent)":result==="L"?"var(--red)":"var(--muted2)";
      return `<button class="row clickable" style="width:100%;border:1px solid var(--border);text-align:left;font-family:inherit;color:inherit;" data-edit="${m.id}">
        <div class="result-badge" style="border-color:${color};color:${color};">${result}</div>
        <div style="flex:1;text-align:left;">
          <div style="font-weight:600;">vs ${esc(m.opponent)||"TBC"} <span style="color:var(--border2);font-weight:400;">(${m.homeAway})</span></div>
          <div style="color:var(--muted2);font-size:12px;">${fmtDate(m.date)}</div>
        </div>
        <div style="font-family:'Oswald',sans-serif;font-size:18px;">${m.ourScore}–${m.theirScore}</div>
      </button>`;
    }).join("")}
  `;
  document.getElementById("newMatch").onclick = ()=>{
    view.matchForm = {id:uid(), date:todayISO(), opponent:"", homeAway:"Home", ourScore:0, theirScore:0, scorers:[]};
    render();
  };
  $main.querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick = ()=>{
      const m = data.matches.find(x=>x.id===b.dataset.edit);
      view.matchForm = {...m, scorers:[...m.scorers]};
      render();
    };
  });
}

/* ---------------- SCORERS ---------------- */
function renderScorers(){
  const tally = {};
  data.matches.forEach(m=> m.scorers.forEach(s=> tally[s.playerId] = (tally[s.playerId]||0)+s.goals));
  const rows = data.players.map(p=>({...p, goals:tally[p.id]||0})).filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals);
  $main.innerHTML = `
    <div class="section-head"><div class="eyebrow">GOLDEN BOOT</div><h1 class="title">Top Scorers</h1></div>
    ${rows.length===0?`<div class="empty">No goals logged yet — add them from a match.</div>`:""}
    ${rows.map((p,i)=>`
      <div class="row">
        <div class="rank" style="color:${i===0?'var(--gold)':'var(--border2)'};">${i+1}</div>
        <div class="name">${esc(p.name)}</div>
        <div style="font-family:'Oswald',sans-serif;font-size:20px;color:var(--accent);">${p.goals}</div>
      </div>`).join("")}
  `;
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=> navigator.serviceWorker.register("service-worker.js"));
}
</script>
</body>
</html>
